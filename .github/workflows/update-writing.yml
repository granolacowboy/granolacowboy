name: Update latest writing

on:
  schedule:
    - cron: '0 7 * * 1'   # weekly, Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh writing section from granolacowboy.dev RSS
        run: |
          python3 - <<'PY'
          import urllib.request, xml.etree.ElementTree as ET, re, pathlib
          xml = urllib.request.urlopen("https://granolacowboy.dev/rss.xml", timeout=30).read()
          root = ET.fromstring(xml)
          items = []
          for it in root.iter("item"):
              t = (it.findtext("title") or "").strip()
              l = (it.findtext("link") or "").strip()
              if t and l:
                  items.append(f"- [{t}]({l})")
              if len(items) >= 5:
                  break
          block = "\n".join(items) if items else "- (no posts yet)"
          p = pathlib.Path("README.md")
          s = p.read_text()
          new = re.sub(
              r"(<!-- BLOG-POSTS:START -->).*?(<!-- BLOG-POSTS:END -->)",
              lambda m: m.group(1) + "\n" + block + "\n" + m.group(2),
              s, flags=re.S,
          )
          if new != s:
              p.write_text(new)
              print("updated")
          else:
              print("no change")
          PY
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || { git commit -m "chore: refresh latest writing"; git push; }
