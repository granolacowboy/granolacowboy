name: Repository Garden Read-Only Sweep A

on:
  push:
    branches: [repo-garden-staging]
    paths:
      - .github/workflows/repo-garden-sweep-a.yml

permissions:
  contents: write

concurrency:
  group: repo-garden-sweep-a
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Clone staging control plane without external actions
        run: |
          git clone --depth 1 --branch repo-garden-staging \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" work

      - name: Run Repository Garden unit tests
        working-directory: work
        run: python3 -m unittest discover -s repo-garden/tests -v

      - name: Materialize read-only Sweep A
        working-directory: work
        run: python3 repo-garden/scripts/materialize_sweep_a.py --date 2025-05-24

      - name: Validate state
        working-directory: work
        run: python3 repo-garden/scripts/validate_state.py

      - name: Commit analysis state only
        working-directory: work
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            repo-garden/state/checkpoint.json \
            repo-garden/state/live_stars.jsonl \
            repo-garden/state/sweep_a_2025-05-24_level0.jsonl \
            repo-garden/queues/redundant_forks_level0_unapproved.jsonl \
            repo-garden/queues/nonstarred_forks_value_review.jsonl \
            repo-garden/queues/level0_anomalies.jsonl \
            repo-garden/reports/AUTO_SWEEP_A.md
          if git diff --cached --quiet; then
            echo "No analysis changes to commit."
          else
            git commit -m "repo garden: materialize read-only Sweep A"
            git push origin HEAD:repo-garden-staging
          fi
